name: skinmatch
description: "SkinMatch - AI-powered skincare ingredient analyzer with OCR."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # UI & Icons
  cupertino_icons: ^1.0.8
  # lucide_icons: ^0.257.0
  flutter_lucide: 1.55.0
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
